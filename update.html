<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https:; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Actualización de WowBrowser</title>
    <link rel="icon" type="image/svg+xml" href="assets/wowbrowser-mark.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="update-page">
    <main class="update-page-card">
      <img class="update-page-mark" src="assets/wowbrowser-mark.svg" alt="">
      <span class="eyebrow">WOWBROWSER · WINDOWS</span>
      <h1>Actualización de WowBrowser</h1>
      <p>Descarga la versión más reciente para seguir explorando tus servidores favoritos.</p>
      <div class="update-page-version">
        <span>Versión disponible</span>
        <strong id="update-available-version" aria-live="polite">—</strong>
      </div>
      <div class="update-page-actions">
        <a class="secondary-button button-link" id="update-release-link" href="https://github.com/microbica/WowBrowser-Releases/releases/latest" target="_blank" rel="noopener noreferrer" data-open-external>Notas de la versión</a>
        <a class="primary-button button-link" id="update-installer-link" href="https://github.com/microbica/WowBrowser-Releases/releases/latest/download/WowBrowser-win-Setup.exe" target="_blank" rel="noopener noreferrer" data-open-external>Descargar instalador .exe</a>
        <a class="secondary-button button-link" id="update-portable-link" href="https://github.com/microbica/WowBrowser-Releases/releases/latest/download/WowBrowser-win-Portable.zip" target="_blank" rel="noopener noreferrer" data-open-external>Descargar portátil .zip</a>
      </div>
      <p class="update-page-note">Los enlaces apuntan siempre a la publicación más reciente.</p>
    </main>
    <script src="update.js"></script>
  </body>
</html>
